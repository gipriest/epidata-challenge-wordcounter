name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Generar reporte Allure
        if: ${{ !cancelled() }}
        run: npm run allure:generate
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reportes
          path: |
            allure-report/
            playwright-report/
            summary-report/
          retention-days: 14
